name: AI Regression

# جدا از CI اصلی نگه داشته شده چون تماس واقعی (و billed) با مدل‌ها می‌زنه
# و به‌خاطر غیرقطعی‌بودن ذاتی LLM، نباید merge هر PR رو مسدود کنه.
# شبانه اجرا می‌شه + همیشه از UI Actions قابل اجرای دستیه.
on:
  schedule:
    - cron: '0 6 * * *' # هر روز ۶ صبح UTC
  workflow_dispatch:
    inputs:
      suiteId:
        description: 'ai_eval_suites.id مورد اجرا'
        required: true

jobs:
  run-eval-suite:
    name: Run AI eval suite
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ai-eval-run
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/ai-eval-run" \
            -H "Authorization: Bearer ${{ secrets.AI_REGRESSION_TEST_USER_JWT }}" \
            -H "Content-Type: application/json" \
            -d '{"suiteId":"${{ github.event.inputs.suiteId || secrets.AI_REGRESSION_DEFAULT_SUITE_ID }}"}')
          BODY=$(echo "$RESPONSE" | head -n -1)
          STATUS=$(echo "$RESPONSE" | tail -n1)
          echo "$BODY"
          if [ "$STATUS" -ge 300 ]; then
            echo "ai-eval-run returned HTTP $STATUS"
            exit 1
          fi
          PASS_COUNT=$(echo "$BODY" | grep -o '"passCount":[0-9]*' | grep -o '[0-9]*')
          CASE_COUNT=$(echo "$BODY" | grep -o '"caseCount":[0-9]*' | grep -o '[0-9]*')
          HALLUCINATIONS=$(echo "$BODY" | grep -o '"hallucinationCount":[0-9]*' | grep -o '[0-9]*')
          echo "Pass rate: $PASS_COUNT / $CASE_COUNT — hallucinations: $HALLUCINATIONS"
          if [ "$HALLUCINATIONS" -gt 0 ]; then
            echo "::warning::AI regression suite flagged $HALLUCINATIONS possible hallucination(s) — review ai_eval_results."
          fi
          if [ "$CASE_COUNT" -gt 0 ] && [ "$PASS_COUNT" -lt "$CASE_COUNT" ]; then
            echo "::error::$((CASE_COUNT - PASS_COUNT)) of $CASE_COUNT eval cases failed."
            exit 1
          fi
  # Deterministic voice-agent red team (no network, no LLM). Nightly + on demand; the PR gate is voice-redteam.yml.
  # Tracks attack-success-rate over time: history.jsonl is restored from / saved to the Actions cache.
  voice-redteam:
    name: Voice red-team scorecard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Restore ASR history
        uses: actions/cache@v4
        with:
          path: eval/voice-redteam/history.jsonl
          key: voice-redteam-history-${{ github.run_id }}
          restore-keys: voice-redteam-history-
      - name: Run red team (fails on any critical-class success or FRR > 2%)
        env:
          RT_RECORD: '1'
        run: npm run test:redteam
      - name: Publish scorecard
        if: always()
        run: |
          [ -f eval/voice-redteam/out/scorecard.md ] && cat eval/voice-redteam/out/scorecard.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-redteam-scorecard
          path: |
            eval/voice-redteam/out/
            eval/voice-redteam/history.jsonl

  # NOTE: this job header used to be indented by 12 spaces, which made YAML treat it as part of the previous
  # step's shell script (the job never existed). Re-indented to a real job.
  run-voice-eval-suite:
    name: Run voice brand eval suite
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' }}
    steps:
      - name: Trigger ai-eval-run (voice)
        env:
          VOICE_SUITE_ID: ${{ secrets.AI_REGRESSION_VOICE_SUITE_ID }}
        run: |
          if [ -z "$VOICE_SUITE_ID" ]; then echo "AI_REGRESSION_VOICE_SUITE_ID not set; skipping."; exit 0; fi
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/ai-eval-run" \
            -H "Authorization: Bearer ${{ secrets.AI_REGRESSION_TEST_USER_JWT }}" \
            -H "Content-Type: application/json" \
            -d "{\"suiteId\":\"$VOICE_SUITE_ID\"}")
          BODY=$(echo "$RESPONSE" | head -n -1)
          STATUS=$(echo "$RESPONSE" | tail -n1)
          echo "$BODY"
          if [ "$STATUS" -ge 300 ]; then echo "ai-eval-run returned HTTP $STATUS"; exit 1; fi
          PASS=$(echo "$BODY" | grep -o '"passCount":[0-9]*' | grep -o '[0-9]*')
          CASES=$(echo "$BODY" | grep -o '"caseCount":[0-9]*' | grep -o '[0-9]*')
          if [ "$CASES" -gt 0 ] && [ "$PASS" -lt "$CASES" ]; then
            echo "::error::$((CASES - PASS)) of $CASES voice eval cases failed."
            exit 1
          fi
