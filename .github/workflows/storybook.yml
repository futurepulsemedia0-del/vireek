name: Storybook build

# Optional check: type-checks the stories and builds the static catalogue. Not part of ci.yml.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.storybook/**'
      - 'src/components/ui/**'
      - 'src/index.css'
      - 'src/styles/**'
      - 'tailwind.config.js'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: storybook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check stories
        run: npm run typecheck:storybook

      - name: Build Storybook
        run: npm run build-storybook

      - name: Upload static build
        uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 14
