name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  migration-lint:
    name: Migration lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Lint migrations (new files strict, legacy warn)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/lint-migrations.mjs

  openapi-drift:
    name: OpenAPI drift (api-v1 routes vs published spec)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Node 22 runs the TypeScript contract natively — no `npm ci` needed, so this gate is fast.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Fail if api-v1, its contract and public/openapi.json disagree
        run: node scripts/openapi.mjs check

      - name: Lint the published spec (Spectral, rules in .spectral.yaml)
        run: npx --yes @stoplight/spectral-cli@6.15.0 lint public/openapi.json --fail-severity=warn

  docs-samples:
    name: Docs code samples (executed, not just rendered)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests==2.32.3

      - name: Run every cURL/JavaScript/Python/Go sample, webhook-verification sample and quickstart
        run: node scripts/run-samples.mjs

      - name: Fail if the generated TypeScript SDK differs from the contract
        run: node scripts/gen-sdk.mjs check
  asset-budget:
    name: Asset budget (images, fonts, SVG)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-asset-budget.mjs
      - run: npm ci
      - run: npm run check:images
  bundle-size:
    name: Bundle-size budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Check budgets
        run: node scripts/check-bundle-size.mjs
        env:
          BUDGET_INITIAL_JS_KB: ${{ vars.BUDGET_INITIAL_JS_KB }}
          BUDGET_CHUNK_JS_KB: ${{ vars.BUDGET_CHUNK_JS_KB }}
          BUDGET_TOTAL_JS_KB: ${{ vars.BUDGET_TOTAL_JS_KB }}
          BUDGET_TOTAL_CSS_KB: ${{ vars.BUDGET_TOTAL_CSS_KB }}

  lighthouse:
    name: Lighthouse CI (public pages)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14.0 autorun --config=lighthouserc.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 14
            interpreter-eval:
    name: Interpreter eval gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/interpreter-eval.mjs

  vertical-ai-eval:
    name: Vertical AI eval gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/vertical-eval.mjs
