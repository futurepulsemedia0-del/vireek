name: Brand audit

# PRs:      static checks only (fast, no secrets, no browser) + token ratchet.
# Nightly:  static + crawl (public + authenticated routes), Lighthouse, axe, screenshots.
# Release:  same as nightly with depth=full and every runtime category REQUIRED to be measured.
on:
  pull_request:
  schedule:
    - cron: '0 3 * * *'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      depth:
        description: 'Crawl depth'
        type: choice
        options: [smoke, standard, full]
        default: standard

concurrency:
  group: brand-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static brand checks + token ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Token ratchet (no new raw colors / sizes)
        run: npm run lint:tokens
      - name: Static brand audit (gate uses scripts/brand-audit/baselines/scores.json)
        run: node scripts/brand-audit/run.mjs --static-only --check --out reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brand-audit-static
          path: |
            reports/brand-audit.html
            reports/brand-audit.json
          retention-days: 14

  crawl:
    name: Crawl + Lighthouse + axe (nightly / release)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DEPTH: ${{ github.event.inputs.depth || (github.event_name == 'release' && 'full') || 'standard' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Restore previous run (for regression detection)
        uses: actions/cache/restore@v4
        with:
          path: reports/brand-audit.json
          key: brand-audit-prev-${{ github.run_id }}
          restore-keys: brand-audit-prev-

      - name: Crawler self-test (proves the harness before trusting its numbers)
        run: npm run brand:audit:selftest

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Lighthouse (public key routes, list generated from scripts/brand-audit/config.mjs)
        run: |
          node scripts/brand-audit/lhci-config.mjs > lighthouserc.brand-audit.json
          npx --yes @lhci/cli@0.14.0 collect --config=lighthouserc.brand-audit.json

      - name: Serve production build
        run: |
          npm run preview -- --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 2; done

      - name: Brand audit (crawl, score, gate)
        env:
          # Use a SANDBOX tenant. The crawler only navigates and blocks non-GET requests, but never point it at production data.
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          BRAND_AUDIT_STAFF_EMAIL: ${{ secrets.BRAND_AUDIT_STAFF_EMAIL }}
          BRAND_AUDIT_STAFF_PASSWORD: ${{ secrets.BRAND_AUDIT_STAFF_PASSWORD }}
        run: |
          REQUIRE=""
          if [ "${{ github.event_name }}" = "release" ]; then REQUIRE="--require-measured a11y,performance,seo,states,mobile"; fi
          node scripts/brand-audit/run.mjs --base-url http://localhost:4173 --depth "$DEPTH" --lhci-dir .lighthouseci --check $REQUIRE

      - name: Job summary
        if: always()
        run: |
          node -e "const r=require('./reports/brand-audit.json');let s='## Brand audit: '+r.overall+' / 100 (coverage '+r.coverage+'%)\n\n| Category | Score |\n|---|---|\n';for(const c of r.categories)s+='| '+c.label+' | '+(c.score??'NOT RUN')+' |\n';require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY,s)" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brand-audit-report
          path: |
            reports/brand-audit.html
            reports/brand-audit.json
            reports/brand-audit/
            .lighthouseci/
          retention-days: 30

      - name: Save this run as the next "previous"
        if: always()
        uses: actions/cache/save@v4
        with:
          path: reports/brand-audit.json
          key: brand-audit-prev-${{ github.run_id }}
