version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: UTC
    open-pull-requests-limit: 8
    labels: [dependencies]
    commit-message:
      prefix: 'chore(deps)'
    groups:
      react:
        patterns: ['react', 'react-dom', 'react-router-dom', '@types/react*']
      testing:
        patterns: ['vitest', '@vitest/*', '@testing-library/*', '@playwright/test', 'jsdom']
      lint-format:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'globals', 'prettier']
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ['react', 'react-dom', 'react-router-dom']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: UTC
    labels: [dependencies, ci]
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        patterns: ['*']
