    <!-- Applies the stored/system theme to theme-color before first paint (values = bg-primary tokens). -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem('vireek-theme');
          var x = localStorage.getItem('vireek-theme-explicit') === '1';
          var d = p === 'dark' || (p === 'system' && x && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', d ? '#141413' : '#FAF9F5');
          if (d) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
