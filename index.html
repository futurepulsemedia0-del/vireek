<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Vireek</title>
    <meta name="title" content="Vireek" />
    <meta
      name="description"
      content="Vireek is an AI-powered phone answering and scheduling service for home service businesses. Never miss a call, capture every lead, and book more jobs — 24/7."
    />
    <link rel="canonical" href="https://vireek.com" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#2563eb" />

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vireek.com/" />
    <meta property="og:title" content="Vireek" />
    <meta
      property="og:description"
      content="AI-powered phone answering and scheduling for home service businesses. Never miss a call, capture every lead, and book more jobs — 24/7."
    />
    <meta property="og:image" content="https://vireek.com/web-app-manifest-512x512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vireek" />
    <meta
      name="twitter:description"
      content="AI-powered phone answering and scheduling for home service businesses. Never miss a call, capture every lead, and book more jobs — 24/7."
    />
    <meta name="twitter:image" content="https://vireek.com/web-app-manifest-512x512.png" />

    <!-- Organization Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Vireek",
        "url": "https://vireek.com",
        "logo": "https://vireek.com/web-app-manifest-512x512.png"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
